services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hauling_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hauling_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./supabase/migrations/002_add_pit_tare.sql:/docker-entrypoint-initdb.d/002_schema.sql
      - ./supabase/migrations/003_rename_pit_to_stockpile.sql:/docker-entrypoint-initdb.d/003_schema.sql
      - ./supabase/migrations/004_rebuild_trips_schema.sql:/docker-entrypoint-initdb.d/004_schema.sql
      - ./supabase/migrations/005_drop_tare_jetty.sql:/docker-entrypoint-initdb.d/005_schema.sql
      - ./supabase/migrations/006_barge_loadings.sql:/docker-entrypoint-initdb.d/006_schema.sql
      - ./supabase/migrations/007_analytics_role.sql:/docker-entrypoint-initdb.d/007_schema.sql
      - ./supabase/migrations/008_add_adjustment.sql:/docker-entrypoint-initdb.d/008_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hauling_user -d hauling_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://hauling_user:${DB_PASSWORD}@db:5432/hauling_tracker
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://${SERVER_IP}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - backend

volumes:
  postgres_data:
